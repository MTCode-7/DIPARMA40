<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DI PARMA | الدفع قيد المعالجة</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#020508;color:#edf0f7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#070e1c;border:1px solid rgba(255,215,0,.3);border-radius:20px;padding:40px 32px;text-align:center;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.icon{font-size:4rem;margin-bottom:16px}
h1{color:#FFD700;font-size:1.5rem;margin-bottom:10px;font-weight:800}
p{color:#6b7a90;font-size:.9rem;line-height:1.7;margin-bottom:24px}
.btn{display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#FFE066,#FFD700);color:#000;border-radius:10px;text-decoration:none;font-weight:700;font-size:.9rem}
.spinner{width:40px;height:40px;border:3px solid rgba(255,215,0,.2);border-top-color:#FFD700;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
.ref{font-family:monospace;font-size:.72rem;color:#3d4a5c;margin-top:16px;padding:8px;background:rgba(255,255,255,.03);border-radius:8px}
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <div class="icon">⏳</div>
  <h1>الدفع قيد المعالجة</h1>
  <p>جارٍ معالجة دفعتك عبر Nuvei × Mashreq Bank.<br>لا تغلق هذه الصفحة — سيتم إشعارك فور اكتمال التسوية.</p>
  <a href="/dashboard.php" class="btn">تحقق من الحالة</a>
  <div class="ref" id="refBox"></div>
</div>
<script>
var p = new URLSearchParams(window.location.search);
var ref = p.get('clientUniqueId') || p.get('merchant_unique_id') || p.get('ref') || '';
if (ref) document.getElementById('refBox').textContent = 'Reference: ' + ref;
// تحقق تلقائي كل 5 ثوانٍ
setInterval(function(){
  if (!ref) return;
  fetch('/api/check_transaction.php?reference=' + encodeURIComponent(ref))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.status === 'completed') window.location.href = '/nuvei-success.html?ref=' + encodeURIComponent(ref);
      else if (d.status === 'failed') window.location.href = '/nuvei-fail.html?ref=' + encodeURIComponent(ref);
    }).catch(function(){});
}, 5000);
</script>
</body>
</html>
