<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DI PARMA | تم الدفع بنجاح</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#020508;color:#edf0f7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#070e1c;border:1px solid rgba(16,185,129,.3);border-radius:20px;padding:40px 32px;text-align:center;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.icon{font-size:4rem;margin-bottom:16px}
h1{color:#10B981;font-size:1.5rem;margin-bottom:10px;font-weight:800}
p{color:#6b7a90;font-size:.9rem;line-height:1.7;margin-bottom:24px}
.btn{display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#FFE066,#FFD700);color:#000;border-radius:10px;text-decoration:none;font-weight:700;font-size:.9rem}
.ref{font-family:monospace;font-size:.72rem;color:#3d4a5c;margin-top:16px;padding:8px;background:rgba(255,255,255,.03);border-radius:8px}
.countdown{font-size:.75rem;color:#3d4a5c;margin-top:12px}
</style>
</head>
<body>
<div class="box">
  <div class="icon">✅</div>
  <h1>تم الدفع بنجاح</h1>
  <p>تمت معالجة دفعتك بنجاح عبر Nuvei × Mashreq Bank.<br>سيتم تأكيد العملية وإرسال إشعار فور اكتمال التسوية.</p>
  <a href="/dashboard.php" class="btn">العودة للوحة التحكم</a>
  <div class="ref" id="refBox"></div>
  <div class="countdown" id="cd">سيتم التحويل تلقائياً خلال <span id="sec">5</span> ثوانٍ...</div>
</div>
<script>
var p = new URLSearchParams(window.location.search);
var ref = p.get('clientUniqueId') || p.get('merchant_unique_id') || p.get('TransactionID') || p.get('ref') || '';
if (ref) document.getElementById('refBox').textContent = 'Reference: ' + ref;
var s = 5;
var t = setInterval(function(){
  s--;
  document.getElementById('sec').textContent = s;
  if (s <= 0) { clearInterval(t); window.location.href = '/dashboard.php'; }
}, 1000);
</script>
</body>
</html>
