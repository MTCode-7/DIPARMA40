<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
    <defs>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#FFE066;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#B58E15;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0A0F1E;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- الخلفية -->
    <rect width="200" height="200" rx="30" fill="url(#darkGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <!-- الشعار الرئيسي -->
    <text x="100" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="url(#goldGrad)">DP</text>
    
    <!-- الخط السفلي -->
    <line x1="50" y1="100" x2="150" y2="100" stroke="url(#goldGrad)" stroke-width="2"/>
    
    <!-- النص السفلي -->
    <text x="100" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#FFD700">DI PARMA</text>
    <text x="100" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#888" letter-spacing="2">SOVEREIGN</text>
    <text x="100" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666" letter-spacing="1">FINANCIAL GATEWAY</text>
    
    <!-- زوايا ذهبية -->
    <rect x="15" y="15" width="12" height="12" rx="3" fill="url(#goldGrad)"/>
    <rect x="173" y="15" width="12" height="12" rx="3" fill="url(#goldGrad)"/>
    <rect x="15" y="173" width="12" height="12" rx="3" fill="url(#goldGrad)"/>
    <rect x="173" y="173" width="12" height="12" rx="3" fill="url(#goldGrad)"/>
    
    <!-- نقطة مركزية -->
    <circle cx="100" cy="200" r="4" fill="url(#goldGrad)"/>
</svg>